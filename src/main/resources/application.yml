server:
  port: ${MCP_SERVER_PORT:1337}

spring:
  application:
    name: embabel-mcp-bioinsight
  ai:
    mcp:
      server:
        type: SYNC

embabel:
  models:
    default-llm: ${EMBABEL_DEFAULT_LLM:x-ai/grok-4.1-fast:free}

# OpenRouter (set OPENAI_API_KEY + OPENAI_BASE_URL=https://openrouter.ai)
spring.ai.openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}

bioinsight:
  api-base-url: ${BIOINSIGHT_API_BASE_URL:http://localhost:8000/api/v1}
  web-ui-base-url: ${BIOINSIGHT_WEB_UI_URL:http://localhost:8080}
  hitl:
    enabled: ${BIOINSIGHT_HITL_ENABLED:false}
  mcp:
    # minimal | standard (default) | full — fewer tools = smaller MCP context at session start
    tool-profile: ${BIOINSIGHT_MCP_TOOL_PROFILE:standard}
    # off = full responses (default). warn = append size notice. truncate = opt-in hard cap only
    compact-mode: ${BIOINSIGHT_MCP_COMPACT_MODE:off}
    max-response-chars: ${BIOINSIGHT_MCP_MAX_RESPONSE_CHARS:0}
    warn-response-chars: ${BIOINSIGHT_MCP_WARN_RESPONSE_CHARS:12000}
    exempt-workflow-tools-from-truncation: true
    default-disease-limit: ${BIOINSIGHT_MCP_DEFAULT_DISEASE_LIMIT:10}

kg-rag:
  enabled: ${KG_RAG_ENABLED:false}
  api-base-url: ${KG_RAG_API_BASE_URL:http://localhost:8001/api/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # M12 ops visibility: per-response tool-profile + char count for CONTEXT_BUDGET tuning.
    # Set to OFF to silence, or keep DEBUG to record response sizes.
    bioinsight.mcp.metrics: ${BIOINSIGHT_MCP_METRICS_LOG_LEVEL:DEBUG}
