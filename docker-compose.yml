# Run MCP against an already-running BioInsight API (e.g. bioinsight-graph on :8000).
# For the full stack (Neo4j + API + web + MCP), use bioinsight-graph:
#   docker compose -f docker-compose.yml -f docker-compose.mcp.yml up --build
#
# Requires OPENAI_API_KEY in .env (copy from .env.example).

services:
  mcp:
    build: .
    container_name: bioinsight-mcp
    ports:
      - "1337:1337"
    environment:
      BIOINSIGHT_API_BASE_URL: ${BIOINSIGHT_API_BASE_URL:-http://host.docker.internal:8000/api/v1}
      MCP_SERVER_PORT: "1337"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai}
      EMBABEL_DEFAULT_LLM: ${EMBABEL_DEFAULT_LLM:-x-ai/grok-4.1-fast:free}
    extra_hosts:
      - "host.docker.internal:host-gateway"
